spec:
  inputs:
    automatic_review:
      description: "Run code review automatically on every MR event."
      default: "true"
    review_depth:
      description: "Review depth preset: `shallow` (fast) or `deep` (thorough)."
      default: "deep"
    review_model:
      description: "Override the model used for code review. Empty = use depth preset."
      default: ""
    reasoning_effort:
      description: "Override reasoning effort. Empty = use depth preset."
      default: ""
    droid_action_repo:
      description: |
        Git repo (clone URL) of droid-action. Override if you mirror it
        privately. Must be reachable from your GitLab runner.
      default: "https://github.com/Factory-AI/droid-action.git"
    droid_action_ref:
      description: |
        Git ref (tag/branch/sha) of droid-action to clone at runtime.
        The same ref SHOULD match the `include: remote:` URL above.
      default: "dev"
    stage:
      description: "GitLab CI stage to assign the droid-review job to."
      default: "test"
---
stages:
  - $[[ inputs.stage ]]

droid-review:
  stage: $[[ inputs.stage ]]
  image: oven/bun:1.2.11
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  variables:
    DROID_STATE_FILE: "$CI_PROJECT_DIR/.droid-state.json"
    DROID_PROMPT_FILE: "/tmp/droid-prompts/droid-prompt.txt"
    DROID_ACTION_DIR: "/tmp/droid-action"
    DROID_ACTION_REPO: "$[[ inputs.droid_action_repo ]]"
    DROID_ACTION_REF: "$[[ inputs.droid_action_ref ]]"
    AUTOMATIC_REVIEW: "$[[ inputs.automatic_review ]]"
    REVIEW_DEPTH: "$[[ inputs.review_depth ]]"
    REVIEW_MODEL: "$[[ inputs.review_model ]]"
    REASONING_EFFORT: "$[[ inputs.reasoning_effort ]]"
    DROID_SUCCESS: "true"
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends git ca-certificates curl
    - git clone --depth 1 --branch "$DROID_ACTION_REF" "$DROID_ACTION_REPO" "$DROID_ACTION_DIR"
    - cd "$DROID_ACTION_DIR" && bun install --frozen-lockfile
    - cd "$CI_PROJECT_DIR"
    - curl --retry 5 --retry-delay 2 --retry-all-errors -fsSL https://app.factory.ai/cli | sh
    - export PATH="$HOME/.local/bin:$PATH"
    - droid --version
  script:
    - export PATH="$HOME/.local/bin:$PATH"
    - |
      if ! bun run "$DROID_ACTION_DIR/src/entrypoints/gitlab-prepare.ts"; then
        export DROID_SUCCESS=false
        echo "gitlab-prepare exited non-zero" > /tmp/droid-error.txt
        exit 1
      fi
    - |
      # Skip droid exec if prepare decided not to review.
      if ! grep -q '"shouldRunReview": true' "$DROID_STATE_FILE"; then
        echo "shouldRunReview=false in state; skipping droid exec."
        exit 0
      fi
    - |
      # Source the resolved env shim from gitlab-prepare to expose
      # RESOLVED_MODEL / RESOLVED_REASONING_EFFORT / DROID_MR_IID /
      # DROID_TRACKING_NOTE_ID for both droid exec calls and the MCP server.
      if [ -f /tmp/droid-prompts/resolved-env.sh ]; then
        # shellcheck disable=SC1091
        . /tmp/droid-prompts/resolved-env.sh
      fi
    - |
      droid mcp remove gitlab_mr 2>/dev/null || true
      droid mcp add gitlab_mr "bun run $DROID_ACTION_DIR/src/mcp/gitlab-mr-server.ts" \
        --env CI_PROJECT_ID="$CI_PROJECT_ID" \
        --env CI_API_V4_URL="$CI_API_V4_URL" \
        --env GITLAB_TOKEN="$GITLAB_TOKEN" \
        --env DROID_MR_IID="$DROID_MR_IID" \
        --env DROID_TRACKING_NOTE_ID="$DROID_TRACKING_NOTE_ID"
    - |
      # ---- Pass 1: candidate generation ----
      # Note: gitlab_mr___submit_review and the MR-mutation tools are
      # NOT included here. Pass 1 must only WRITE the candidates JSON.
      PASS1_TOOLS="Read,Grep,Glob,LS,Execute,Edit,Create,ApplyPatch,Task,Skill,FetchUrl"
      DROID_ARGS="exec -f $DROID_PROMPT_FILE --enabled-tools $PASS1_TOOLS --output-format stream-json --skip-permissions-unsafe --tag code-review"
      if [ -n "$RESOLVED_MODEL" ]; then DROID_ARGS="$DROID_ARGS --model $RESOLVED_MODEL"; fi
      if [ -n "$RESOLVED_REASONING_EFFORT" ]; then DROID_ARGS="$DROID_ARGS --reasoning-effort $RESOLVED_REASONING_EFFORT"; fi
      echo "Running Pass 1 (candidates): droid $DROID_ARGS"
      if ! droid $DROID_ARGS; then
        export DROID_SUCCESS=false
        echo "droid exec pass 1 (candidates) failed" > /tmp/droid-error.txt
        exit 1
      fi
    - |
      # ---- Prepare Pass 2 prompt ----
      if ! bun run "$DROID_ACTION_DIR/src/entrypoints/gitlab-prepare-validator.ts"; then
        export DROID_SUCCESS=false
        echo "gitlab-prepare-validator failed" > /tmp/droid-error.txt
        exit 1
      fi
    - |
      # ---- Pass 2: validator (posts approved comments) ----
      # gitlab_mr___submit_review and gitlab_mr___update_tracking_note are
      # the only MR-mutation tools we expose. The model batches all approved
      # findings into a single submit_review call.
      PASS2_TOOLS="Read,Grep,Glob,LS,Execute,Edit,Create,ApplyPatch,Skill,gitlab_mr___submit_review,gitlab_mr___update_tracking_note"
      DROID_ARGS="exec -f $DROID_PROMPT_FILE --enabled-tools $PASS2_TOOLS --output-format stream-json --skip-permissions-unsafe --tag code-review"
      if [ -n "$RESOLVED_MODEL" ]; then DROID_ARGS="$DROID_ARGS --model $RESOLVED_MODEL"; fi
      if [ -n "$RESOLVED_REASONING_EFFORT" ]; then DROID_ARGS="$DROID_ARGS --reasoning-effort $RESOLVED_REASONING_EFFORT"; fi
      echo "Running Pass 2 (validator): droid $DROID_ARGS"
      if ! droid $DROID_ARGS; then
        export DROID_SUCCESS=false
        echo "droid exec pass 2 (validator) failed" > /tmp/droid-error.txt
        exit 1
      fi
  after_script:
    - export PATH="$HOME/.local/bin:$PATH"
    - export DROID_ERROR_DETAILS="$(cat /tmp/droid-error.txt 2>/dev/null || true)"
    - bun run "$DROID_ACTION_DIR/src/entrypoints/gitlab-update-comment-link.ts" || true
  artifacts:
    when: always
    paths:
      - .droid-state.json
      - /tmp/droid-prompts/review_candidates.json
      - /tmp/droid-prompts/review_validated.json
      - /tmp/droid-prompts/droid-prompt.txt
    expire_in: 1 week
